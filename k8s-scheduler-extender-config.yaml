apiVersion: v1
kind: ConfigMap
metadata:
  name: green-scheduler-extender-config
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    profiles:
      - schedulerName: green-scheduler
        plugins:
          filter:
            enabled:
              - name: GreenEdge
          preScore:
            enabled:
              - name: GreenEdge
          score:
            enabled:
              - name: GreenEdge
          reserve:
            enabled:
              - name: GreenEdge
    extenders: []