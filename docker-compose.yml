services:
  app:
    build: .
    image: green-edge-webhook:local
    ports:
      - "5000:5000"
    environment:
      ELECTRICITY_MAPS_TOKEN: ${ELECTRICITY_MAPS_TOKEN:-}
      ELECTRICITY_MAPS_ZONE: ${ELECTRICITY_MAPS_ZONE:-IN}
    volumes:
      - ./india_monthly_full_release_long_format.csv:/app/india_monthly_full_release_long_format.csv
      - ./india_forecast_predictions.csv:/app/india_forecast_predictions.csv
    networks: [green-observability]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [green-observability]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/green-edge.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/green-edge.json:ro
      - grafana_data:/var/lib/grafana
    networks: [green-observability]
    restart: unless-stopped

networks:
  green-observability:

volumes:
  prometheus_data:
  grafana_data: